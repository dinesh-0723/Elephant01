<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Launching Soon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        body {
            background: #000;
        }

        .elephant-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        h1 {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: max-content;
            max-width: calc(100% - 32px);
            margin: 0;
            padding: clamp(20px, 5vw, 36px) clamp(24px, 7vw, 64px);
            border: 1px solid rgba(255, 220, 150, 0.55);
            border-radius: 18px;
            background: rgba(12, 10, 7, 0.58);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.45), inset 0 0 24px rgba(255, 220, 150, 0.08);
            backdrop-filter: blur(8px);
            color: #ffe4a8;
            text-align: center;
            font-size: clamp(28px, 8vw, 72px);
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1.15;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(255, 190, 90, 0.55), 0 3px 12px rgba(0, 0, 0, 0.9);
            z-index: 1;
            animation: title-glow 3s ease-in-out infinite alternate;
        }

        h1::after {
            content: "";
            display: block;
            width: 42%;
            height: 2px;
            margin: 18px auto 0;
            background: linear-gradient(90deg, transparent, #ffd27b, transparent);
        }

        @keyframes title-glow {
            from {
                box-shadow: 0 12px 50px rgba(0, 0, 0, 0.45), inset 0 0 24px rgba(255, 220, 150, 0.08);
            }

            to {
                box-shadow: 0 12px 60px rgba(0, 0, 0, 0.55), inset 0 0 32px rgba(255, 220, 150, 0.14);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            h1 {
                animation: none;
            }
        }

    </style>
</head>

<body>

    <!-- Background image -->
    <img
        class="elephant-image"
        src="./Designer_LandScape.png"
        alt="Elephant"
    >

    <!-- Telugu heading -->
    <h1>Launching Soon</h1>

    <!-- Background music: no visible controls -->
    <audio id="backgroundMusic" autoplay loop preload="auto">
        <source src="./Dike.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
    </audio>

    <script>
        const music = document.getElementById("backgroundMusic");

        music.volume = 1.0;

        async function startMusic() {
            try {
                await music.play();
                document.removeEventListener("pointerdown", startMusic);
                document.removeEventListener("keydown", startMusic);
            } catch (error) {
                console.info("Audio will start after a page interaction.", error);
            }
        }

        document.addEventListener("pointerdown", startMusic);
        document.addEventListener("keydown", startMusic);
        startMusic();
    </script>

</body>
</html>
