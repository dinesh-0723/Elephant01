<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Launching Soon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        body {
            background: #000;
        }

        .elephant-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        h1 {
            position: fixed;
            top: clamp(22px, 5vw, 48px);
            right: clamp(20px, 5vw, 56px);
            margin: 0;
            color: #d9dde5;
            background: linear-gradient(115deg, #858b96 0%, #f8f9fb 38%, #aeb4bf 68%, #f1f2f5 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: "Segoe Script", "Brush Script MT", cursive;
            font-size: clamp(22px, 4vw, 42px);
            font-style: normal;
            font-weight: 600;
            letter-spacing: 0.01em;
            line-height: 1.2;
            text-align: right;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 20px rgba(220, 228, 240, 0.42);
            z-index: 1;
        }

        h1::after {
            content: "";
            display: block;
            width: 58%;
            height: 2px;
            margin: 10px 0 0 auto;
            background: linear-gradient(90deg, transparent, #e1e4eb);
            box-shadow: 0 0 10px rgba(220, 228, 240, 0.55);
        }

    </style>
</head>

<body>

    <!-- Background image -->
    <img
        class="elephant-image"
        src="./Designer_LandScape.png"
        alt="Elephant"
    >

    <!-- Telugu heading -->
    <h1>Launching Soon</h1>

    <!-- Background music: no visible controls -->
    <audio id="backgroundMusic" autoplay loop preload="auto">
        <source src="./Dike.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
    </audio>

    <script>
        const music = document.getElementById("backgroundMusic");

        music.volume = 1.0;

        async function startMusic() {
            try {
                await music.play();
                document.removeEventListener("pointerdown", startMusic);
                document.removeEventListener("keydown", startMusic);
            } catch (error) {
                console.info("Audio will start after a page interaction.", error);
            }
        }

        document.addEventListener("pointerdown", startMusic);
        document.addEventListener("keydown", startMusic);
        startMusic();
    </script>

</body>
</html>
