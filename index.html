<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ఓం శ్రీ గణేశాయ నమః</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        body {
            background: #000;
        }

        .elephant-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        h1 {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: 95%;
            margin: 0;
            padding: 12px 18px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            text-align: center;
            font-size: clamp(18px, 4vw, 32px);
            z-index: 1;
        }

        #musicButton {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 18px;
            border: 0;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.72);
            color: white;
            font: inherit;
            cursor: pointer;
            z-index: 2;
        }

        #musicButton[hidden] {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Background image -->
    <img
        class="elephant-image"
        src="./Zolt.jpg"
        alt="Elephant"
    >

    <!-- Telugu heading -->
    <h1>ఓం శ్రీ గణేశాయ నమః</h1>

    <button id="musicButton" type="button">Play background music</button>

    <!-- Background music: no visible controls -->
    <audio id="backgroundMusic" autoplay loop preload="auto">
        <source src="./Dike.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
    </audio>

    <script>
        const music = document.getElementById("backgroundMusic");
        const musicButton = document.getElementById("musicButton");

        music.volume = 1.0;

        async function playBackgroundMusic() {
            try {
                await music.play();
            } catch (error) {
                musicButton.hidden = false;
                console.info("Playback needs user interaction in this browser.", error);
            }
        }

        music.addEventListener("playing", () => {
            musicButton.hidden = true;
        });

        musicButton.addEventListener("click", playBackgroundMusic);

        document.addEventListener("DOMContentLoaded", () => {
            playBackgroundMusic();
        });
    </script>

</body>
</html>
