
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఓం శ్రీ గణేశాయ నమః</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        .elephant-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            padding: 0.6rem 1rem;
            border-radius: 0.5rem;
            background: rgb(0 0 0 / 45%);
            color: white;
            text-align: center;
            white-space: nowrap;
        }

        audio {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: min(90%, 400px);
        }
    </style>
</head>
<body>
    <img class="elephant-image" src="Zolt.jpg" alt="Elephant">
    <h1>ఓం శ్రీ గణేశాయ నమః</h1>
    <audio src="Dike.mp3" autoplay loop controls>
        Your browser does not support audio playback.
    </audio>
</body>
</html>
