
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Launching Soon</title>

    <!-- ================================= -->
    <!-- FAVICON FOR ALL BROWSERS -->
    <!-- ================================= -->

    <!-- Browser favicon fallback -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=2" sizes="any">

    <!-- Chrome, Edge, Firefox -->
    <link rel="icon" type="image/png" sizes="16x16"
          href="./favicon-16x16.png?v=2">

    <link rel="icon" type="image/png" sizes="32x32"
          href="./favicon-32x32.png?v=2">

    <!-- Android Chrome -->
    <link rel="icon" type="image/png" sizes="192x192"
          href="./android-chrome-192x192.png?v=2">

    <!-- Apple iPhone and iPad -->
    <link rel="apple-touch-icon" sizes="180x180"
          href="./apple-touch-icon.png?v=2">

    <!-- Web App Manifest -->
    <link rel="manifest" href="./site.webmanifest">

    <!-- Browser Theme Color -->
    <meta name="theme-color" content="#000000">

    <!-- Mobile Browser Compatibility -->
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-title"
          content="Launching Soon">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Georgia, serif;
        }

        body {
            background: #000;
        }

        /* BACKGROUND IMAGE */

        .elephant-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* LAUNCHING SOON HEADING */

        h1 {
            position: fixed;

            top: clamp(22px, 5vw, 48px);
            right: clamp(20px, 5vw, 56px);

            margin: 0;

            background: linear-gradient(
                115deg,
                #858b96 0%,
                #f8f9fb 38%,
                #aeb4bf 68%,
                #f1f2f5 100%
            );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            font-family:
                "Segoe Script",
                "Brush Script MT",
                cursive;

            font-size: clamp(22px, 4vw, 42px);

            font-style: normal;
            font-weight: 600;

            letter-spacing: 0.01em;
            line-height: 1.2;

            text-align: right;

            text-shadow:
                0 2px 6px rgba(0, 0, 0, 0.95),
                0 0 20px rgba(220, 228, 240, 0.42);

            z-index: 1;
        }

        /* DECORATIVE UNDERLINE */

        h1::after {
            content: "";

            display: block;

            width: 58%;
            height: 2px;

            margin: 10px 0 0 auto;

            background: linear-gradient(
                90deg,
                transparent,
                #e1e4eb
            );

            box-shadow:
                0 0 10px rgba(220, 228, 240, 0.55);
        }

    </style>

</head>

<body>

    <!-- ================================= -->
    <!-- BACKGROUND IMAGE -->
    <!-- ================================= -->

    <img
        class="elephant-image"
        src="./Designer_LandScape.png"
        alt="Elephant"
    >

    <!-- ================================= -->
    <!-- WEBSITE HEADING -->
    <!-- ================================= -->

    <h1>Launching Soon</h1>

    <!-- ================================= -->
    <!-- BACKGROUND MUSIC -->
    <!-- ================================= -->

    <audio
        id="backgroundMusic"
        autoplay
        loop
        preload="auto"
    >
        <source src="./Dike.mp3" type="audio/mpeg">

        Your browser does not support audio playback.

    </audio>

    <!-- ================================= -->
    <!-- MUSIC AUTOPLAY SCRIPT -->
    <!-- ================================= -->

    <script>

        const music =
            document.getElementById("backgroundMusic");

        music.volume = 1.0;

        async function startMusic() {

            try {

                await music.play();

                document.removeEventListener(
                    "pointerdown",
                    startMusic
                );

                document.removeEventListener(
                    "keydown",
                    startMusic
                );

            } catch (error) {

                console.info(
                    "Music will start after user interaction."
                );

            }

        }

        document.addEventListener(
            "pointerdown",
            startMusic
        );

        document.addEventListener(
            "keydown",
            startMusic
        );

        startMusic();

    </script>

</body>
</html>
